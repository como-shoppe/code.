<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝦皮折扣碼</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f7f8fa;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h1 {
      color: #ee4d2d;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .category-title {
      text-align: left;
      color: #d0011b;
      font-size: 15px;
      font-weight: bold;
      margin: 18px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .coupon-card {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .coupon-btn {
      width: 100%;
      background-color: #ee4d2d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .coupon-btn:active {
      background-color: #d03e1f;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>蝦皮折扣碼</h1>
  <p class="subtitle">點擊按鈕自動複製折扣碼並前往蝦皮</p>

  <!-- 全站折扣券 -->
  <div class="category-title">📍 全站折扣券</div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('SHPAF99')">全站滿 $100 折 $20</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('99SP829')">全站滿 $1000 折 $999</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('99SP830')">全站滿 $1000 折 $999</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('99SP908')">全站滿 $1000 折 $999</button>
  </div>

  <!-- 全站 $299-$30 -->
  <div class="category-title">📍 全站 $299-$30</div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('SVSP2609')">7-11 滿 $299 折 $30</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('FMSP2609')">全家 滿 $299 折 $30</button>
  </div>

  <!-- 商城折扣券 -->
  <div class="category-title">📍 商城折扣券</div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('SVAP2609')">7-11 商城滿 $299 折 $30</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('FMAPP2609')">全家 商城滿 $299 折 $30</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('HLAPP2609')">萊爾富 商城滿 $299 折 $30</button>
  </div>

  <!-- 社群賣家滿 $999 折 $100 -->
  <div class="category-title">📍 社群賣家滿 $999 折 $100</div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('AUAFF100')">社群賣家滿 $999 折 $100</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('0909MTOB2')">社群賣家滿 $999 折 $100</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('0909NDD2')">社群賣家滿 $999 折 $100</button>
  </div>

  <!-- 社群賣家滿 $499 折 $40 -->
  <div class="category-title">📍 社群賣家滿 $499 折 $40</div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('AUAFF40')">社群賣家滿 $499 折 $40</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('0909MTOB1')">社群賣家滿 $499 折 $40</button>
  </div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('0909NDD1')">社群賣家滿 $499 折 $40</button>
  </div>

  <!-- 社群賣家滿 $499 折 $60 -->
  <div class="category-title">📍 社群賣家滿 $499 折 $60</div>
  <div class="coupon-card">
    <button class="coupon-btn" onclick="copyAndRedirect('SEPONE60')">社群賣家滿 $499 折 $60 (18:00生效)</button>
  </div>

</div>

<script>
  function copyAndRedirect(code) {
    // 複製折扣碼到剪貼簿
    navigator.clipboard.writeText(code).then(() => {
      alert('已複製折扣碼！即將前往蝦皮');
      // 開啟蝦皮 App 或網站
      window.location.href = 'https://shopee.tw';
    }).catch(err => {
      console.error('複製失敗: ', err);
    });
  }
</script>

</body>
</html>
