<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10/10 蝦皮折扣碼</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f7f8fa;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }
    .container {

    }
    h1 {

    }

    }
    .category-title {
      text-align: left;
      color: #d0011b;
      font-size: 15px;
      font-weight: bold;
      margin: 18px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .coupon-card {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .coupon-btn {
      width: 100%;
      background-color: #ee4d2d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .coupon-btn:active {
      background-color: #d03e1f;
    }
  </style>
</head>
<body>

<div class="container">

  </div>

</div>

<script>
  function copyAndRedirect(code) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(code).then(() => {
        handleSuccess(code);
      }).catch(err => {
        fallbackCopy(code);
      });
    } else {
      fallbackCopy(code);
    }
  }

  function fallbackCopy(code) {
    const textArea = document.createElement("textarea");
    textArea.value = code;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      handleSuccess(code);
    } catch (err) {
      alert('複製失敗，請手動複製折扣碼：' + code);
    }
    document.body.removeChild(textArea);
  }

  function handleSuccess(code) {
    alert('已複製折扣碼【' + code + '】！即將前往蝦皮');
    window.location.href = 'https://s.shopee.tw/1gIS38bX2Y';
  }
</script>

</body>
