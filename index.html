<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝦皮折扣碼</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ee4d2d;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 13px;
            color: #666;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #ee4d2d;
            margin: 18px 0 10px 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid #ee4d2d;
        }
        .btn {
            background-color: #ee4d2d;
            color: white;
            border: none;
            padding: 14px 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            text-align: center;
            line-height: 1.4;
        }
        .btn:active {
            opacity: 0.85;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 100;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>蝦皮折扣碼</h1>
        <p>點擊按鈕自動複製折扣碼並前往蝦皮</p>
    </div>

    <!-- 全站折扣券 -->
    <div class="section-title">📍 全站折扣券</div>
    <div class="card">
        <button class="btn" data-code="SHAFF18" data-url="https://s.shopee.tw/7VFfwsYZNl">全站滿 $100 折 $20</button>
    </div>

    <!-- 商城折扣券 -->
    <div class="section-title">📍 商城折扣券</div>
    <div class="card">
        <button class="btn" data-code="FMAPP260818" data-url="https://s.shopee.tw/7VFfwsYZNl">商城全家滿 $299 折 $30</button>
    </div>

    <!-- 社群賣家滿 $999 折 $100 -->
    <div class="section-title">📍 社群賣家滿 $999 折 $100</div>
    <div class="card">
        <button class="btn" data-code="BVAFF100" data-url="https://s.shopee.tw/7VFfwsYZNl">社群賣家滿 $999 折 $100 (BVAFF100)</button>
    </div>
    <div class="card">
        <button class="btn" data-code="0818MTOB2" data-url="https://s.shopee.tw/7VFfwsYZNl">社群賣家滿 $999 折 $100 (0818MTOB2)</button>
    </div>
    <div class="card">
        <button class="btn" data-code="0818NDD2" data-url="https://s.shopee.tw/7VFfwsYZNl">社群賣家滿 $999 折 $100 (0818NDD2)</button>
    </div>

    <!-- 社群賣家滿 $499 折 $40 -->
    <div class="section-title">📍 社群賣家滿 $499 折 $40</div>
    <div class="card">
        <button class="btn" data-code="BVAFF40" data-url="https://s.shopee.tw/7VFfwsYZNl">社群賣家滿 $499 折 $40 (BVAFF40)</button>
    </div>
    <div class="card">
        <button class="btn" data-code="0818MTOB1" data-url="https://s.shopee.tw/7VFfwsYZNl">社群賣家滿 $499 折 $40 (0818MTOB1)</button>
    </div>
    <div class="card">
        <button class="btn" data-code="0818NDD1" data-url="https://s.shopee.tw/7VFfwsYZNl">社群賣家滿 $499 折 $40 (0818NDD1)</button>
    </div>

</div>

<div id="toast" class="toast">折扣碼已複製！跳轉前往蝦皮...</div>

<script>
    document.querySelectorAll('.btn').forEach(button => {
        button.addEventListener('click', function() {
            const code = this.getAttribute('data-code');
            const targetUrl = this.getAttribute('data-url');
            const toast = document.getElementById('toast');
            
            navigator.clipboard.writeText(code).then(() => {
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                    window.open(targetUrl, '_blank');
                }, 600);
            }).catch(() => {
                window.open(targetUrl, '_blank');
            });
        });
    });
</script>

</body>
</html>
